<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradiente do fundo circular escuro azul marinho Delfos -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B233D" />
      <stop offset="100%" stopColor="#051322" />
    </linearGradient>

    <!-- Laço Superior: Azul cobalto -> Teal -> Esmeralda -> Verde-Limão -> Amarelo Solar -->
    <linearGradient id="fav-top" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#1E5B99" />
      <stop offset="25%" stopColor="#188C88" />
      <stop offset="50%" stopColor="#3DAE60" />
      <stop offset="78%" stopColor="#ADC82B" />
      <stop offset="100%" stopColor="#F8D415" />
    </linearGradient>

    <!-- Laço Inferior: Amarelo Solar -> Verde-Limão -> Esmeralda -> Teal -> Azul profundo -->
    <linearGradient id="fav-bottom" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#F8D415" />
      <stop offset="22%" stopColor="#ADC82B" />
      <stop offset="50%" stopColor="#3DAE60" />
      <stop offset="75%" stopColor="#188C88" />
      <stop offset="100%" stopColor="#1E5B99" />
    </linearGradient>
  </defs>

  <!-- Fundo escuro com cantos arredondados suaves para perfeito contraste em abas claras e escuras -->
  <rect width="128" height="128" rx="28" fill="url(#bg-grad)" />

  <!-- Símbolo oficial dos arcos/laços solares envolventes da Delfos Solar -->
  <g transform="translate(64, 64) scale(0.92) translate(-64, -64)">
    <!-- Arco Superior -->
    <path
      d="M 16 56 C 26 34, 52 24, 64 24 C 76 24, 102 34, 112 56 C 98 42, 78 35, 64 35 C 50 35, 30 42, 16 56 Z"
      fill="url(#fav-top)"
    />

    <!-- Arco Inferior -->
    <path
      d="M 16 72 C 30 86, 50 93, 64 93 C 78 93, 98 86, 112 72 C 102 94, 76 104, 64 104 C 52 104, 26 94, 16 72 Z"
      fill="url(#fav-bottom)"
    />

    <!-- Sol central estilizado / núcleo de energia solar -->
    <circle cx="64" cy="64" r="13" fill="#F8D415" />

    <!-- Letra 'D' vazada ou ponto de luz para identidade instantânea mesmo em 16x16 -->
    <path
      d="M 59 56 L 64 56 C 68.5 56, 71.5 58.5, 71.5 64 C 71.5 69.5, 68.5 72, 64 72 L 59 72 Z M 62 59 L 62 69 L 64 69 C 66.5 69, 68.5 67.5, 68.5 64 C 68.5 60.5, 66.5 59, 64 59 Z"
      fill="#0B233D"
    />
  </g>
</svg>
