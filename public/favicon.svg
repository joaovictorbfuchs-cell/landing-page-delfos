<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Fundo institucional Delfos #061325 -> #0A1E38 -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2447" />
      <stop offset="100%" stop-color="#061325" />
    </linearGradient>

    <!-- Gradiente Arco Superior: Azul cobalto (#015BA1) -> Verde (#5DA55F) -> Amarelo ouro (#FDE107) -->
    <linearGradient id="fav-top-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#015BA1" />
      <stop offset="28%" stop-color="#17768A" />
      <stop offset="52%" stop-color="#5DA55F" />
      <stop offset="76%" stop-color="#C4C048" />
      <stop offset="100%" stop-color="#FDE107" />
    </linearGradient>

    <!-- Gradiente Arco Inferior: Amarelo ouro (#FFE304) -> Verde (#53A063) -> Azul cobalto (#015BA1) -->
    <linearGradient id="fav-bot-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFE304" />
      <stop offset="24%" stop-color="#C4C048" />
      <stop offset="48%" stop-color="#53A063" />
      <stop offset="72%" stop-color="#17768A" />
      <stop offset="100%" stop-color="#015BA1" />
    </linearGradient>

    <filter id="fav-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fundo na cor institucional com cantos arredondados -->
  <rect width="128" height="128" rx="28" fill="url(#fav-bg)" />

  <!-- Borda de acabamento sutil -->
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#FDE107" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Marca Oficial Delfos: Arcos envolventes e Monograma D oficial em alto contraste -->
  <g transform="translate(64, 64) scale(0.95) translate(-64, -64)" filter="url(#fav-shadow)">
    <!-- Arco Superior Energético (curvatura e gradiente idênticos à arte oficial) -->
    <path
      d="M 12 52 C 22 26, 52 14, 64 14 C 76 14, 106 26, 116 52 C 100 37, 78 28, 64 28 C 50 28, 28 37, 12 52 Z"
      fill="url(#fav-top-grad)"
    />

    <!-- Arco Inferior Energético -->
    <path
      d="M 12 76 C 28 91, 50 100, 64 100 C 78 100, 100 91, 116 76 C 106 102, 76 114, 64 114 C 52 114, 22 102, 12 76 Z"
      fill="url(#fav-bot-grad)"
    />

    <!-- Letra 'd' oficial estilizada no centro, em azul celeste vibrante com contorno branco sutil para legibilidade em 16/32px -->
    <g transform="translate(64, 64) translate(-18, -18)">
      <!-- Letra d minúscula com o traço vertical ascendente característico da Delfos -->
      <path
        d="M 23 2 L 23 11 C 20.8 7.5, 16.5 6, 12.5 6 C 5.5 6, 0 11.5, 0 19 C 0 26.5, 5.5 32, 12.5 32 C 16.5 32, 20.8 30.5, 23 27 L 23 32 L 31 32 L 31 2 Z M 15.5 25.2 C 11.8 25.2, 8.8 22.4, 8.8 19 C 8.8 15.6, 11.8 12.8, 15.5 12.8 C 19.2 12.8, 22.2 15.6, 22.2 19 C 22.2 22.4, 19.2 25.2, 15.5 25.2 Z"
        fill="#38BDF8"
      />
    </g>
  </g>
</svg>
