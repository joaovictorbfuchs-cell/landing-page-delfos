<svg viewBox="0 0 128 128" width="128" height="128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    {/* Gradiente superior: Azul profundo -> Verde esmeralda -> Amarelo Solar */}
    <linearGradient id="fav-top" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="30%" stop-color="#0D9488" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="85%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    {/* Gradiente inferior: Amarelo Solar -> Verde -> Teal/Azul profundo */}
    <linearGradient id="fav-bottom" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="20%" stop-color="#84CC16" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="75%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
  </defs>

  {/* Fundo suave circular para contraste em qualquer aba de navegador */}
  <circle cx="64" cy="64" r="62" fill="#061526" />
  <circle cx="64" cy="64" r="60" stroke="#FACC15" stroke-width="1.5" stroke-opacity="0.3" />

  {/* Arco Superior do Laço Delfos */}
  <path
    d="M 16 60 C 26 36, 52 22, 64 22 C 76 22, 102 36, 112 60 C 98 34, 76 28, 64 28 C 52 28, 30 34, 16 60 Z"
    fill="url(#fav-top)"
  />

  {/* Arco Inferior do Laço Delfos */}
  <path
    d="M 16 68 C 30 94, 52 100, 64 100 C 76 100, 98 94, 112 68 C 102 92, 76 106, 64 106 C 52 106, 26 92, 16 68 Z"
    fill="url(#fav-bottom)"
  />

  {/* Monograma central 'd' da Delfos Solar em alto contraste */}
  <text
    x="64"
    y="78"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="'Poppins', sans-serif, system-ui"
    font-weight="800"
    font-size="44"
  >
    d
  </text>
</svg>
