<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="pwa-bg-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2447" />
      <stop offset="100%" stop-color="#061325" />
    </linearGradient>

    <!-- Laço Superior Oficial: Azul cobalto -> Teal -> Esmeralda -> Verde Solar -> Amarelo Solar (#F5B301) -->
    <linearGradient id="pwa-top-192" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#194D82" />
      <stop offset="22%" stop-color="#14807C" />
      <stop offset="48%" stop-color="#2DA85C" />
      <stop offset="76%" stop-color="#A5C723" />
      <stop offset="100%" stop-color="#F5B301" />
    </linearGradient>

    <!-- Laço Inferior Oficial: Amarelo Solar (#F5B301) -> Verde Solar -> Esmeralda -> Teal -> Azul cobalto -->
    <linearGradient id="pwa-bottom-192" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F5B301" />
      <stop offset="24%" stop-color="#A5C723" />
      <stop offset="52%" stop-color="#2DA85C" />
      <stop offset="78%" stop-color="#14807C" />
      <stop offset="100%" stop-color="#194D82" />
    </linearGradient>

    <radialGradient id="pwa-sun-192" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="70%" stop-color="#F5B301" />
      <stop offset="100%" stop-color="#D99F00" />
    </radialGradient>

    <radialGradient id="pwa-ambient-192" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F5B301" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F5B301" stop-opacity="0" />
    </radialGradient>

    <filter id="pwa-shadow-192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados suaves para maskable icon / app icon -->
  <rect width="192" height="192" rx="42" fill="url(#pwa-bg-192)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="#F5B301" stroke-width="2" stroke-opacity="0.25" />

  <!-- Brilho ambiente -->
  <circle cx="96" cy="96" r="75" fill="url(#pwa-ambient-192)" />

  <!-- Símbolo da marca perfeitamente centralizado com margem segura -->
  <g transform="translate(96, 96) scale(1.42) translate(-64, -64)" filter="url(#pwa-shadow-192)">
    <!-- Arco Superior -->
    <path
      d="M 17 56 C 27 33, 51 23, 64 23 C 77 23, 101 33, 111 56 C 97 42, 78 35, 64 35 C 50 35, 31 42, 17 56 Z"
      fill="url(#pwa-top-192)"
    />

    <!-- Arco Inferior -->
    <path
      d="M 17 72 C 31 86, 50 93, 64 93 C 78 93, 97 86, 111 72 C 101 95, 77 105, 64 105 C 51 105, 27 95, 17 72 Z"
      fill="url(#pwa-bottom-192)"
    />

    <!-- Sol Central -->
    <circle cx="64" cy="64" r="14.5" fill="url(#pwa-sun-192)" />

    <!-- D estilizado da marca -->
    <path
      d="M 59 55 L 64.5 55 C 69.5 55, 72.8 58, 72.8 64 C 72.8 70, 69.5 73, 64.5 73 L 59 73 Z M 62.4 58.3 L 62.4 69.7 L 64.4 69.7 C 67.2 69.7, 69.3 67.8, 69.3 64 C 69.3 60.2, 67.2 58.3, 64.4 58.3 Z"
      fill="#061325"
    />
  </g>
</svg>
